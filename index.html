<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museu Sala Aberta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeae4;--ink:#23201d;--mute:#6b645d;--panel:#fbf9f6;--line:#d8d0c6;--floor:#a9794f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a1f;--ink:#ece7e0;--mute:#a39c93;--panel:#26242b;--line:#3a373f}}
:root[data-theme="dark"]{--bg:#1b1a1f;--ink:#ece7e0;--mute:#a39c93;--panel:#26242b;--line:#3a373f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.5}
h1,h2,.ui{font-family:'Bricolage Grotesque',system-ui,sans-serif}
header{padding:20px 20px 8px}
h1{margin:0;font-size:clamp(34px,8vw,64px);line-height:1;letter-spacing:-.03em;font-weight:800}
header p{margin:8px 0 0;color:var(--mute);max-width:46ch}
nav{display:flex;gap:10px;padding:14px 20px;overflow-x:auto}
nav button{flex:0 0 auto;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 15px 'Bricolage Grotesque',system-ui,sans-serif;padding:10px 16px;border-radius:999px 999px 6px 6px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid #3b6cff;outline-offset:2px}
#room{margin:0 12px;border-radius:6px;overflow:hidden;position:relative;transition:background .6s}
#wall{display:flex;gap:clamp(28px,6vw,72px);align-items:center;padding:44px 28px 52px;overflow-x:auto;scroll-snap-type:x proximity;min-height:360px}
#wall.in{animation:lights 1.1s ease-out}
@keyframes lights{from{filter:brightness(.25)}to{filter:none}}
#floor{height:26px;background:linear-gradient(#8a5e3b,var(--floor))}
.work{flex:0 0 auto;scroll-snap-align:center;text-align:left;background:none;border:0;padding:0;color:inherit;cursor:pointer}
.frame{display:block;padding:10px;background:#f6f2ea;box-shadow:0 0 0 5px #2b2420,0 18px 28px -10px rgba(0,0,0,.55);transition:transform .25s}
.work:hover .frame{transform:translateY(-4px)}
.frame svg{display:block;height:min(46vw,230px);width:auto}
.tag{display:block;margin:20px 0 0 4px;font:700 13px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--wallink);max-width:22ch}
.tag i{display:block;font:italic 15px 'Newsreader',serif;font-weight:400;opacity:.85}
.info{padding:22px 20px 8px;max-width:60ch}
.info h2{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
.info p{margin:0;color:var(--mute)}
#ov{position:fixed;inset:0;background:rgba(10,9,12,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:5;overflow-y:auto}
#ov.on{display:flex}
.card{background:var(--panel);width:min(860px,100%);max-height:100%;overflow-y:auto;border-radius:8px;padding:20px;display:grid;gap:18px}
.card .art{display:flex;justify-content:center;background:#e6e0d6;padding:20px;border-radius:4px}
.card .art svg{max-height:46vh;width:auto;max-width:100%;box-shadow:0 14px 26px -8px rgba(0,0,0,.5)}
.card h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.meta{color:var(--mute);margin:4px 0 12px;font-style:italic}
.card p{margin:0 0 10px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl button{font:700 15px 'Bricolage Grotesque',system-ui,sans-serif;padding:10px 16px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.ctl .close{background:var(--ink);color:var(--bg);margin-left:auto}
.frame img{display:block;height:min(46vw,230px);width:auto;max-width:72vw;object-fit:contain}
.card .art img{max-height:46vh;max-width:100%;box-shadow:0 14px 26px -8px rgba(0,0,0,.5)}
.empty{margin:0;color:var(--wallink);font:700 18px 'Bricolage Grotesque',system-ui,sans-serif;max-width:30ch}
#lock,#cur{margin:18px 20px 0;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--panel)}
#cur summary{cursor:pointer;font-weight:700}
.cf{display:grid;gap:10px;margin-top:12px;max-width:520px}
.cf input,.cf textarea{font:16px 'Newsreader',Georgia,serif;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.cf button{font:700 15px 'Bricolage Grotesque',system-ui,sans-serif;padding:12px;border-radius:6px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
#cm{margin:0;color:var(--mute)}
#fa{font:16px 'Newsreader',Georgia,serif;padding:8px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.dcl{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font:700 15px 'Bricolage Grotesque',system-ui,sans-serif;text-decoration:none}
.dcl[hidden]{display:none}
.lk{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:0;margin-left:10px}
.cf .alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
@media(min-width:760px){.card{grid-template-columns:1fr 1fr}.ctl{grid-column:1/-1}}
footer{padding:20px;color:var(--mute);font-size:15px}
@media(prefers-reduced-motion:reduce){#wall.in{animation:none}.frame{transition:none}}
</style>
</head>

<h1>Museu Sala Aberta</h1>
<p>Quatro salas. A última é da nossa comunidade. Toque em um quadro para chegar mais perto.</p>
<a id="dcl" class="dcl" hidden target="_blank" rel="noopener noreferrer">Entrar no nosso Discord</a>
</header>
<nav id="nav" aria-label="Salas do museu"></nav>
<main>
<section id="room"><div id="wall"></div><div id="floor"></div></section>
<div class="info"><h2 id="rt"></h2><p id="rd"></p></div>
<div class="info" id="fw" hidden><label class="ui" for="fa">Ver obras de </label><select id="fa"></select></div>
</main>
<div id="lock" hidden><div class="cf"><p id="lm"></p><input id="pw" type="password" autocomplete="off" placeholder="Senha do curador"><button id="pb">Entrar</button></div></div>
<details id="cur" hidden><summary class="ui">Painel do curador</summary>
<div class="cf"><button id="out" class="alt">Sair do modo curador</button><label for="lu" class="ui">Link do servidor do Discord</label><input id="lu" type="url" maxlength="200" placeholder="https://discord.gg/seu-convite"><button id="ls" class="alt">Salvar link do Discord</button><input type="file" id="cf" accept="image/*"><input id="ct" placeholder="Título da obra"><input id="ca" placeholder="Artista (nome no Discord)"><textarea id="cx" rows="3" placeholder="Descrição (opcional)"></textarea><button id="cb">Adicionar à Sala da Comunidade</button><p id="cm"></p><button id="rs" class="alt">Descartar rascunho</button></div></details>
<footer>As obras das três primeiras salas são fictícias. A Sala da Comunidade mostra obras enviadas por membros do nosso Discord.<button id="ent" class="lk">Área do curador</button></footer>
<div id="ov" role="dialog" aria-modal="true" aria-label="Detalhes da obra"><div class="card" id="card"></div></div>

var FILT='',COMM=[],CUR=false,OK=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
var HASH='',TS=0,TS0=0,FAIL=false,LINK='';try{var ST=JSON.parse(document.getElementById('state').textContent);if(Array.isArray(ST))COMM=ST;else{COMM=ST.obras||[];HASH=ST.h||'';TS=ST.ts||0;LINK=ST.lk||''}}catch(e){}TS0=TS;
function commRoom(){return {n:'Sala da Comunidade',wall:'#e3c07a',ink:'#2d1f06',d:'Obras enviadas por membros da nossa comunidade no Discord.',w:COMM.map(function(c,k){return OK.test(c.i)?{t:c.t,a:c.a,y:c.y,m:'Enviada pela comunidade',x:c.x||'',k:k,s:'<img src="'+c.i+'" alt="'+esc(c.t)+'">'}:null}).filter(function(o){return o&&(!FILT||o.a===FILT)})}}
var cur=0,open=-1;
var nav=document.getElementById('nav'),wall=document.getElementById('wall'),room=document.getElementById('room'),ov=document.getElementById('ov'),card=document.getElementById('card');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function esc0(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function drawNav(){nav.innerHTML='';ROOMS.forEach(function(r,i){var b=document.createElement('button');b.textContent=r.n;b.setAttribute('aria-current',i===cur);b.onclick=function(){go(i)};nav.appendChild(b)})}
function go(i){cur=i;var r=ROOMS[i];room.style.background=r.wall;room.style.setProperty('--wallink',r.ink);
 wall.innerHTML='';r.w.forEach(function(o,k){var b=document.createElement('button');b.className='work';b.setAttribute('aria-label','Ver obra '+o.t);
  b.innerHTML='<span class="frame">'+o.s+'</span><span class="tag">'+esc(o.t)+'<i>'+esc(o.a)+', '+o.y+'</i></span>';
  b.onclick=function(){show(k)};wall.appendChild(b)});
 if(!r.w.length)wall.innerHTML='<p class="empty">Ainda não há obras aqui. Envie a sua no Discord para entrar na exposição.</p>';
 wall.scrollLeft=0;wall.classList.remove('in');void wall.offsetWidth;wall.classList.add('in');
 document.getElementById('rt').textContent=r.n;document.getElementById('rd').textContent=r.d;drawNav();drawFilter()}
function show(k){var w=ROOMS[cur].w,n=w.length;open=(k+n)%n;var o=w[open];
 card.innerHTML='<div class="art">'+o.s+'</div><div><h2>'+esc(o.t)+'</h2><p class="meta">'+esc(o.a)+', '+o.y+'. '+esc(o.m)+'.</p><p>'+esc(o.x)+'</p></div><div class="ctl"><button id="pv">Obra anterior</button><button id="nx">Próxima obra</button>'+(o.k!=null&&CUR?'<button id="ed">Editar informações</button><button id="rm">Remover obra</button>':'')+'<button class="close" id="cl">Fechar</button></div>';
 document.getElementById('pv').onclick=function(){show(open-1)};document.getElementById('nx').onclick=function(){show(open+1)};document.getElementById('cl').onclick=hide;var ed=document.getElementById('ed');if(ed)ed.onclick=function(){editWork(o)};var rm=document.getElementById('rm');if(rm)rm.onclick=function(){if(confirm('Remover esta obra do museu?')){COMM.splice(o.k,1);save('Obra removida.')}};
 ov.classList.add('on');document.getElementById('cl').focus()}
function hide(){ov.classList.remove('on')}
ov.onclick=function(e){if(e.target===ov)hide()};
document.addEventListener('keydown',function(e){if(!ov.classList.contains('on'))return;if(e.key==='Escape')hide();if(e.key==='ArrowRight')show(open+1);if(e.key==='ArrowLeft')show(open-1)});
ROOMS.push(commRoom());
function drawFilter(){var w=document.getElementById('fw'),f=document.getElementById('fa'),n=[];COMM.forEach(function(c){if(OK.test(c.i)&&n.indexOf(c.a)<0)n.push(c.a)});w.hidden=!(cur===3&&n.length>1);if(w.hidden)return;f.innerHTML='<option value="">Todos os artistas</option>'+n.sort().map(function(x){return '<option>'+esc(x)+'</option>'}).join('');f.value=FILT}
document.getElementById('fa').onchange=function(){FILT=this.value;ROOMS[3]=commRoom();go(3)};
function editWork(o){var c=COMM[o.k],b=card.children[1],g=function(i){return document.getElementById(i)};
 b.innerHTML='<div class="cf"><input id="et" maxlength="120" placeholder="Título"><input id="ea" maxlength="80" placeholder="Artista (nome no Discord)"><textarea id="ex" rows="4" maxlength="1000" placeholder="Descrição"></textarea><button id="es">Salvar alterações</button><p id="em"></p></div>';
 g('et').value=c.t;g('ea').value=c.a;g('ex').value=c.x||'';
 g('es').onclick=function(){var t=g('et').value.trim(),a=g('ea').value.trim();if(!t||!a){g('em').textContent='Título e artista são obrigatórios.';return}c.t=t;c.a=a;c.x=g('ex').value.trim();g('es').disabled=true;g('em').textContent='Salvando…';save('Alterações salvas.')}}
function say(t){document.getElementById('cm').textContent=t}
function shrink(f){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)})}
function idb(){return new Promise(function(res,rej){var q=indexedDB.open('sala-aberta',1);q.onupgradeneeded=function(){q.result.createObjectStore('k')};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
async function idbSet(v){var d=await idb();return new Promise(function(res,rej){var t=d.transaction('k','readwrite');t.objectStore('k').put(v,'draft');t.oncomplete=res;t.onerror=function(){rej(t.error)}})}
async function idbGet(){var d=await idb();return new Promise(function(res,rej){var q=d.transaction('k').objectStore('k').get('draft');q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
async function idbDel(){var d=await idb();return new Promise(function(res,rej){var t=d.transaction('k','readwrite');t.objectStore('k').delete('draft');t.oncomplete=res;t.onerror=function(){rej(t.error)}})}
async function persist(){TS=Date.now();await idbSet({obras:COMM,h:HASH,ts:TS,lk:LINK})}
async function loadDraft(){try{var d=await idbGet();if(d&&d.ts>TS){COMM=d.obras||[];HASH=d.h||HASH;LINK=d.lk!=null?d.lk:LINK;drawLink();TS=d.ts;ROOMS[3]=commRoom();go(cur)}}catch(e){}}
async function save(msg){try{await persist()}catch(e){FAIL=true;say('Não foi possível guardar neste navegador. Baixe o backup agora para não perder as obras.');return false}
 ROOMS[3]=commRoom();hide();go(3);status();say(msg+' Salvo neste navegador.');return true}
function download(){var b=new Blob([build()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';try{localStorage.setItem('sala_exp',String(TS))}catch(e){}status();document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);say('Arquivo baixado. Envie-o para a hospedagem para publicar as mudanças.')}
document.getElementById('cb').onclick=async function(){var f=document.getElementById('cf').files[0],t=document.getElementById('ct').value.trim(),a=document.getElementById('ca').value.trim();
 if(!f||!t||!a){say('Escolha a imagem e preencha título e artista.');return}
 try{say('Preparando imagem…');var img=await shrink(f);COMM.push({i:img,t:t,a:a,x:document.getElementById('cx').value.trim(),y:new Date().getFullYear()});await save('Obra adicionada.');['cf','ct','ca','cx'].forEach(function(i){document.getElementById(i).value=''})}catch(e){COMM.pop();say('Não consegui ler essa imagem.')}};
async function sha(p){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sala-aberta|'+p));return Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
function remember(){try{sessionStorage.setItem('cur_ok','1')}catch(e){}try{localStorage.setItem('sala_curador','1')}catch(e){}}
function openPanel(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}CUR=true;document.getElementById('lu').value=LINK;document.getElementById('lock').hidden=true;document.getElementById('cur').hidden=false}
async function showLock(){await loadDraft();var ok=false;try{ok=sessionStorage.getItem('cur_ok')==='1'}catch(e){}
 if(ok&&HASH){openPanel();return}
 var L=document.getElementById('lock'),m=document.getElementById('lm'),b=document.getElementById('pb'),i=document.getElementById('pw');
 L.hidden=false;m.textContent=HASH?'Digite a senha do curador para abrir o painel.':'Crie uma senha do curador (mínimo 6 caracteres). Você vai usá-la sempre que abrir o painel.';b.textContent=HASH?'Entrar':'Criar senha';
 b.onclick=async function(){try{var v=i.value;
  if(!HASH){if(v.length<6){m.textContent='Use pelo menos 6 caracteres.';return}
   HASH=await sha(v);remember();await persist();i.value='';openPanel();return}
  if(await sha(v)===HASH){remember();i.value='';openPanel()}else m.textContent='Senha incorreta.'}
  catch(e){m.textContent='Este navegador não permite usar senha aqui.'}}}
function lastExp(){try{return +localStorage.getItem('sala_exp')||0}catch(e){return 0}}
function status(){}
function backup(){var b=new Blob([JSON.stringify({obras:COMM,h:HASH,ts:TS,lk:LINK})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-museu.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);say('Backup baixado. Guarde o arquivo em um lugar seguro.')}
window.addEventListener('beforeunload',function(e){if(FAIL){e.preventDefault();e.returnValue=''}});
drawLink();loadDraft().then(status);
document.getElementById('ent').onclick=showLock;
function cleanLink(v){if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{var u=new URL(v),h=u.hostname.toLowerCase();u.protocol='https:';if((h==='discord.gg'&&u.pathname.length>1)||((h==='discord.com'||h==='www.discord.com')&&u.pathname.indexOf('/invite/')===0))return u.href}catch(e){}return ''}
function drawLink(){var a=document.getElementById('dcl'),l=cleanLink(LINK);a.hidden=!l;if(l)a.href=l}
document.getElementById('ls').onclick=async function(){var v=document.getElementById('lu').value.trim(),n=cleanLink(v);if(v&&!n){say('Cole um convite do Discord, como https://discord.gg/seu-convite.');return}
 var old=LINK;LINK=n;try{await persist()}catch(e){LINK=old;FAIL=true;say('Não foi possível guardar neste navegador.');return}
 drawLink();document.getElementById('lu').value=n;say(n?'Link do Discord salvo.':'Link do Discord removido.')};
document.getElementById('out').onclick=function(){try{sessionStorage.removeItem('cur_ok')}catch(e){}try{localStorage.removeItem('sala_curador')}catch(e){}CUR=false;hide();document.getElementById('cur').hidden=true;document.getElementById('lock').hidden=true;document.getElementById('pw').value='';say('');window.scrollTo(0,0)};
document.getElementById('rs').onclick=async function(){if(confirm('Descartar as mudanças ainda não publicadas neste navegador?')){try{await idbDel()}catch(e){}location.reload()}};
go(0);
</script>
